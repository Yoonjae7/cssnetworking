:root{
  --paper:#f8f7f2;
  --card:#fdfcf9;
  --ink:#303044;
  --purple:#7070a2;
  --lavender:#b3aee0;
  --shadow:#d6d4e2;
  --screen:#2a2838;
  --mint:#98e7ad;
  --pink:#f1a1db;
  --sun:#fbe7a6;
  --muted:#55536a;
  --on-purple:#f2f0fb;
  --light-dot:#d9d6f2;
  --font-display:ClearDigits,Pixelify,ui-monospace,Menlo,monospace;
  --font-body:DM,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--paper);color:var(--ink);font:400 14px var(--font-body);overflow:hidden;
  background-image:linear-gradient(rgba(112,112,162,.08) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(112,112,162,.08) 1.5px,transparent 1.5px);background-size:36px 36px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--purple);outline-offset:3px}

.app{height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto;gap:8px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* A panel is a retro window; the far one is the same window turned around */
.panel{min-height:0;display:flex;flex-direction:column;border:3px solid var(--ink);background:var(--card);box-shadow:6px 6px 0 var(--shadow)}
.panel.far{transform:rotate(180deg)}
.bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;height:28px;padding:0 10px;background:var(--purple);color:var(--on-purple);border-bottom:3px solid var(--ink);font:400 15px var(--font-display)}
.bar span{white-space:nowrap}
.lights{display:flex;gap:5px}
.lights i{display:block;width:8px;height:8px;background:var(--light-dot)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:12px}

/* Visitor side: big and plain */
.hello{flex:none;display:flex;align-items:center;gap:8px}
.hello-text{min-width:0;display:flex;flex-direction:column;gap:3px}
.hi{margin:0;font:600 clamp(32px,9.5vw,52px)/1 var(--font-display);letter-spacing:-.5px}
.hi em{font-style:normal;color:var(--purple)}
.role{margin:0;font-weight:600;font-size:clamp(15px,4.2vw,19px);line-height:1.2;text-wrap:balance}
.uni{margin:0;font-size:clamp(13px,3.6vw,16px);line-height:1.2;color:var(--muted)}
.logo{flex:none;margin-left:auto;width:92px;height:88px}
.logo img{display:block;width:100%;height:100%;object-fit:contain}
.target{flex:none;margin:0;align-self:flex-start;padding:3px 10px;background:var(--sun);border:2px solid var(--ink);font:400 clamp(14px,3.8vw,17px) var(--font-display);letter-spacing:.3px;max-width:100%}
.qr-wrap{flex:1;min-height:0;display:flex;justify-content:center}
.qr-box{height:100%;max-width:100%;aspect-ratio:1;background:#fff;display:grid;place-items:center;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--shadow)}
.qr-box svg{display:block;width:100%;height:100%}
.qr-box.empty{aspect-ratio:auto;width:100%;background:transparent;border:3px dashed var(--lavender);box-shadow:none;color:var(--muted);text-align:center;padding:12px;font-size:14px;line-height:1.3}
.qr-url{flex:none;margin:0;padding-top:8px;border-top:2px dashed var(--lavender);font-size:13px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qr-url b{display:block;font:400 15px var(--font-display);color:var(--purple);letter-spacing:1px}

/* My side: small, just choices */
.near .body{gap:6px;padding:8px}
.pick{flex:none;display:grid;gap:6px}
.pick.who{grid-template-columns:1fr 1fr}
.pick.what{grid-template-columns:repeat(3,1fr)}
.pick button{min-height:38px;padding:0 6px;border:2px solid var(--ink);background:var(--card);font:600 14px var(--font-body);line-height:1.1;box-shadow:3px 3px 0 var(--shadow)}
.pick.who button{font:400 18px var(--font-display);letter-spacing:.3px}
.pick button[aria-pressed="true"]{background:var(--mint)}
.pick button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}

.divider{display:flex;align-items:center;gap:10px;min-height:28px;color:var(--purple);font:400 13px var(--font-display);letter-spacing:1.5px;white-space:nowrap}
.divider::before,.divider::after{content:"";flex:1;height:0;border-top:3px dotted var(--lavender)}
.divider .gear{padding:2px 10px;border:2px solid var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--shadow);font:400 13px var(--font-display);letter-spacing:1px;color:var(--ink)}
.divider .gear:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}

/* Link editor */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(42,40,56,.62);display:grid;align-items:end;justify-items:center}
.sheet[hidden]{display:none}
.sheet-card{width:100%;max-width:560px;max-height:100%;overflow:auto;background:var(--card);border:3px solid var(--ink);border-bottom:0;
  padding:14px max(16px,env(safe-area-inset-left,0px)) max(18px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sheet h2{margin:0;font:600 24px var(--font-display)}
.sheet p{margin:0;font-size:14px;color:var(--muted);line-height:1.35}
.sheet label{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:600;color:var(--ink)}
.sheet input{min-height:42px;padding:0 10px;background:var(--paper);border:2px solid var(--ink);font-weight:400;font-size:15px;border-radius:0}
.sheet input::placeholder{color:#8886a0}
.sheet-actions{display:flex;gap:8px;margin-top:4px}
.sheet-actions button{flex:1;min-height:44px;border:2px solid var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--shadow);font:400 18px var(--font-display)}
.sheet-actions .save{background:var(--mint)}

@media (max-height:640px){.uni{display:none}.hi{font-size:30px}.logo{display:none}}
@media (prefers-reduced-motion:no-preference){.pick button,.divider .gear{transition:transform .1s,box-shadow .1s,background .12s}}
</style>

  /* What I tap: small */
  function nearPanel(){
    var rows = [["hack", "NottsHack"], ["insta", "Instagram"], ["person", "LinkedIn"]];
    return '<div class="bar"><span>show.exe</span><span class="lights" aria-hidden="true"><i></i><i></i><i></i></span></div>' +
      '<div class="body">' +
        '<div class="pick who" role="group" aria-label="Who is showing">' +
          ["jack","ben"].map(function(k){ return '<button type="button" data-person="' + k + '" aria-pressed="' + (state.person === k) + '">' + PEOPLE[k].name + '</button>'; }).join("") +
        '</div>' +
        '<div class="pick what" role="group" aria-label="What to show">' +
          rows.map(function(r){ return '<button type="button" data-link="' + r[0] + '" aria-pressed="' + (state.link === r[0]) + '">' + esc(r[1]) + '</button>'; }).join("") +
        '</div>' +
      '</div>';
  }

  var near = document.getElementById("near"), far = document.getElementById("far");
  function render(){ near.innerHTML = nearPanel(); far.innerHTML = farPanel(); }

  document.querySelector(".app").addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.person){ state.person = b.dataset.person; render(); }
    else if (b.dataset.link){ state.link = b.dataset.link; render(); }
  });

  /* Link editor */
  var sheet = document.getElementById("sheet"), form = document.getElementById("form");
  function open(){ KEYS.forEach(function(k){ document.getElementById("f-" + k).value = urls[k] || ""; }); sheet.hidden = false; }
  function close(){ sheet.hidden = true; }
  document.getElementById("edit").addEventListener("click", open);
  document.getElementById("cancel").addEventListener("click", close);
  form.addEventListener("submit", function(e){
    e.preventDefault();
    KEYS.forEach(function(k){
      var v = document.getElementById("f-" + k).value.trim();
      if (v && !/^https?:\/\//i.test(v)) v = "https://" + v;
      urls[k] = v;
    });
    try { localStorage.setItem("meetup-links-v2", JSON.stringify(urls)); } catch(err){}
    close(); render();
  });

  /* Keep the screen on while it sits on the table */
  function wake(){ try { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function(){}); } catch(e){} }
  document.addEventListener("click", wake, {once:true});
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) wake(); });

  render();
})();
</script>
